name: Verify active ePlan worker syntax

on:
  pull_request:
    paths:
      - "src/eplan-lifecycle.mjs"
      - ".github/workflows/verify-active-eplan-worker.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check worker code syntax
        run: node --check src/eplan-lifecycle.mjs
