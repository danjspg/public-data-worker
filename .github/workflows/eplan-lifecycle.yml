name: "[PUBLIC] Process queued ePlan lifecycle work"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eplan-lifecycle.yml"
      - "src/eplan-lifecycle.mjs"
      - "src/eplan-source.mjs"
      - "src/planning-source-registry.mjs"
      - "package.json"
  schedule:
    - cron: "15 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-eplan-lifecycle
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check worker database
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
        run: npm run health
      - name: Process queued ePlan lifecycle items
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          EPLAN_WORKER_LIMIT: "12000"
          EPLAN_WORKER_CONCURRENCY: "6"
          EPLAN_WORKER_PACE_MS: "250"
        run: npm run work:eplan-lifecycle

# Public source fetching is isolated here; production writes remain private.
# Four evenly spaced daily passes keep the active ePlan cohort fresh while preserving source concurrency at 6.
