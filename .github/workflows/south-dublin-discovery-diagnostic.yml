name: "[DIAGNOSTIC] South Dublin Agile discovery"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/south-dublin-discovery-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare South Dublin Agile search filters
        run: |
          node --input-type=module <<'EOF'
          const base = 'https://planningapi.agileapplications.ie/api/application/search'
          const headers = {'x-client':'SD','x-product':'CITIZENPORTAL','x-service':'PA','user-agent':'OpenList South Dublin discovery diagnostic'}
          const variants = [
            ['registered',{registrationDateFrom:'2026-09-19T00:00:00Z',registrationDateTo:'2026-09-29T23:59:59Z',status:'registered'}],
            ['determined',{registrationDateFrom:'2026-09-19T00:00:00Z',registrationDateTo:'2026-09-29T23:59:59Z',status:'determined'}],
            ['unfiltered',{registrationDateFrom:'2026-09-19T00:00:00Z',registrationDateTo:'2026-09-29T23:59:59Z'}],
          ]
          for (const [label, values] of variants) {
            const params = new URLSearchParams(values)
            const response = await fetch(`${base}?${params}`, {headers})
            const text = await response.text()
            if (!response.ok) { console.log(JSON.stringify({label,status:response.status,body:text.slice(0,500)})); continue }
            const json = JSON.parse(text)
            const rows = json.results || []
            console.log(JSON.stringify({label,count:rows.length,refs:rows.map(r=>r.reference).filter(Boolean).sort()}))
          }
          EOF
