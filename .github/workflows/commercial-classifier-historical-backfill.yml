name: Historical commercial classifier backfill

on:
  schedule:
    # Two remaining historical drains at 02:00 Europe/London on 17 and 18 Sep 2026.
    # September is BST, so 02:00 local = 01:00 UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      queue_prefix:
        description: "Queue source prefix to drain"
        required: false
        default: "historical-notable-"
      limit_per_lane:
        description: "Maximum records claimed per lane"
        required: false
        default: "475"

permissions:
  contents: read

concurrency:
  group: historical-commercial-classifier-backfill
  cancel-in-progress: false

jobs:
  classify:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Select scheduled UK drain
        id: drain_window
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_date="$(TZ=Europe/London date +%F)"
          offset="$(TZ=Europe/London date +%z)"
          case "$local_date:$offset:$GITHUB_EVENT_SCHEDULE" in
            "2026-09-17:+0100:0 1 * * *"|"2026-09-18:+0100:0 1 * * *")
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v7
        if: steps.drain_window.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.drain_window.outputs.run == 'true'
        with:
          node-version: 22
      - if: steps.drain_window.outputs.run == 'true'
        run: npm install --no-audit --no-fund
      - name: Drain historical commercial queue lane
        if: steps.drain_window.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          COMMERCIAL_CLASSIFIER_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit_per_lane || '475' }}
          COMMERCIAL_CLASSIFIER_BATCH_SIZE: "8"
          COMMERCIAL_CLASSIFIER_MAX_ATTEMPTS: "4"
          COMMERCIAL_CLASSIFIER_QUEUE_SOURCE_PREFIX: ${{ inputs.queue_prefix || 'historical-notable-' }}
          COMMERCIAL_CLASSIFIER_LANE: ${{ matrix.lane }}
        run: npm run work:commercial-classifier
