name: Process queued planning description repairs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/planning-descriptions.yml"
      - "src/planning-descriptions.mjs"
      - "package.json"
  schedule:
    - cron: "55 0 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-planning-descriptions
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check worker database
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
        run: npm run health
      - name: Process queued planning description repairs
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          DESCRIPTION_WORKER_LIMIT: "400"
        run: npm run work:planning-descriptions
