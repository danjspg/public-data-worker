name: "[PUBLIC] Process queued planning description repairs"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/planning-descriptions.yml"
      - "src/planning-descriptions.mjs"
      - "src/retry-transient.mjs"
      - "package.json"
  schedule:
    # Temporary catch-up cadence; return to maintenance cadence once the finite backlog is cleared.
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-planning-descriptions
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check worker database
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
        run: npm run health
      - name: Retry transient worker failures
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
        run: node src/retry-transient.mjs
      - name: Process queued planning description repairs
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          DESCRIPTION_WORKER_LIMIT: "800"
        run: npm run work:planning-descriptions
