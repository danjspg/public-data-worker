name: "[PUBLIC] Planning description queue status"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/planning-descriptions-status.yml"
      - "src/planning-descriptions-status.mjs"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Report planning description queue
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
        run: node src/planning-descriptions-status.mjs
