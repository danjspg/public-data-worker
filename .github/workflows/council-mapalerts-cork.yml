name: "[PUBLIC] Cork County official weekly application and decision recovery"
on:
  pull_request:
    paths:
      - ".github/workflows/council-mapalerts-cork.yml"
      - "src/council-mapalerts-cork*.mjs"
      - "tests/council-mapalerts-cork*.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/council-mapalerts-cork.yml"
      - "src/council-mapalerts-cork*.mjs"
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: read
concurrency:
  group: cork-county-official-weekly
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate council registration and decision-only evidence
        run: |
          node --check src/council-mapalerts-cork.mjs
          node --check src/council-mapalerts-cork-pilot.mjs
          node --check src/council-mapalerts-cork-sync.mjs
          node --test tests/council-mapalerts-cork.test.mjs
      - name: Verify live official MapAlerts pages without writes
        if: github.event_name == 'pull_request'
        run: |
          node src/council-mapalerts-cork-pilot.mjs
          node src/council-mapalerts-cork-sync.mjs --dry-run

      - name: Stage verified Cork County registrations and neutral decision events
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          CORK_MAPALERTS_DOCUMENT_LIMIT: "6"
        run: node src/council-mapalerts-cork-sync.mjs
