name: "[PUBLIC] Fingal official ArcGIS audit"
on:
  pull_request:
    paths:
      - "src/council-received-fingal-arcgis-audit.mjs"
      - ".github/workflows/fingal-arcgis-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/council-received-fingal-arcgis-audit.mjs
      - run: node src/council-received-fingal-arcgis-audit.mjs
