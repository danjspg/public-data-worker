name: Dedupe active apply backlog

on:
  workflow_dispatch:
  push:
    paths:
      - "src/dedupe-active-apply-backlog.mjs"
      - "src/meaningful-source-signature.mjs"
      - ".github/workflows/dedupe-active-apply-backlog.yml"

permissions:
  contents: read

concurrency:
  group: dedupe-active-apply-backlog
  cancel-in-progress: true

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Consume legacy unchanged active checks
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          ACTIVE_BACKLOG_DEDUPE_LIMIT: "20000"
        run: node src/dedupe-active-apply-backlog.mjs
