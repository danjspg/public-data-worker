name: "[PUBLIC] South Dublin weekly decisions research pilot"

on:
  pull_request:
    paths:
      - ".github/workflows/council-southdublin-pilot.yml"
      - "src/council-southdublin-pilot.mjs"
      - "src/council-weekly-southdublin.mjs"
      - "src/council-weekly-southdublin-sync.mjs"
      - "tests/council-weekly-southdublin.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Ensure PDF text extractor
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
      - name: Validate conservative parser
        run: node --test tests/council-weekly-southdublin.test.mjs
      - name: Validate three real latest weekly council PDFs (no database writes)
        run: node src/council-southdublin-pilot.mjs

      - name: Verify recent document staging and date cutoff (read-only)
        run: node src/council-weekly-southdublin-sync.mjs --dry-run
