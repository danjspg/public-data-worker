name: Operator intelligence fingerprint backfill

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum applications to enrich (1-250)"
        required: false
        default: "50"
      years:
        description: "Historical lookback in years"
        required: false
        default: "8"
      dry_run:
        description: "Call the model but do not persist fingerprints"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/operator-intelligence-fingerprint.mjs"

permissions:
  contents: read

concurrency:
  group: operator-intelligence-fingerprint
  cancel-in-progress: false

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check worker database
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
        run: npm run health
      - name: Build supermarket operator fingerprints
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPERATOR_FINGERPRINT_MODEL: gpt-5.6-luna
          OPERATOR_FINGERPRINT_LIMIT: ${{ inputs.limit || '50' }}
          OPERATOR_FINGERPRINT_YEARS: ${{ inputs.years || '8' }}
          OPERATOR_FINGERPRINT_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node src/operator-intelligence-fingerprint.mjs
