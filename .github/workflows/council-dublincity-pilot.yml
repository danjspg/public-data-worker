name: "[PUBLIC] Dublin City council weekly DOCX research"
on:
  pull_request:
    paths:
      - ".github/workflows/council-dublincity-pilot.yml"
      - "src/council-dublincity-pilot.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check DOCX extractor and script syntax
        run: |
          command -v unzip
          node --check src/council-dublincity-pilot.mjs
      - name: Inspect official weekly DOCX from five Dublin City areas (read only)
        run: node src/council-dublincity-pilot.mjs
