name: Check OpenAI secret availability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-openai-secret.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY_PRESENT=true"
          else
            echo "OPENAI_API_KEY_PRESENT=false"
            exit 2
          fi
