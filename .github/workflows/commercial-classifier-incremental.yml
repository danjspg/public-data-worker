name: "[PUBLIC] Commercial classifier incremental"

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "src/commercial-classifier.mjs"
      - ".github/workflows/commercial-classifier-incremental.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: public-commercial-classifier-incremental
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Classify queued notable applications
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          COMMERCIAL_CLASSIFIER_LIMIT: "40"
          COMMERCIAL_CLASSIFIER_BATCH_SIZE: "8"
          COMMERCIAL_CLASSIFIER_MAX_ATTEMPTS: "4"
        run: npm run work:commercial-classifier
