name: Migrate active exact signatures

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-active-exact-signatures.yml"
      - "src/migrate-active-exact-signatures.mjs"
      - "src/meaningful-source-signature.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-active-exact-signatures
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Migrate compact exact signatures
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
        run: node src/migrate-active-exact-signatures.mjs
