name: "[TEMP] Diagnose ePlan listing"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eplan-listing-diagnostic.yml"
      - "src/eplan-listing-diagnostic.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node src/eplan-listing-diagnostic.mjs
