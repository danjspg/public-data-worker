name: Backfill planning professionals from public sources

on:
  push:
    paths:
      - .github/workflows/planning-professionals.yml
      - src/planning-professionals.mjs
  schedule:
    # One bounded global worker every two hours. This replaces the previous
    # 32-job authority matrix and keeps the queue draining with far fewer Actions.
    - cron: "35 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning-professional-backfill
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Drain planning professional queue
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          PROFESSIONAL_WORKER_LIMIT: "2400"
          PROFESSIONAL_WORKER_DELAY_MS: "650"
          PROFESSIONAL_WORKER_MAX_RUNTIME_MS: "2400000"
          PROFESSIONAL_STALE_LEASE_MINUTES: "60"
        run: npm run work:planning-professionals
