name: Backfill planning professionals from public sources

on:
  push:
    paths:
      - .github/workflows/planning-professionals.yml
      - src/planning-professionals.mjs
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning-professional-backfill
  cancel-in-progress: false

jobs:
  scrape:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        authority:
          - CARLOW
          - CAVAN
          - CLARE
          - DONEGAL
          - GALWAYCOCO
          - GALWAYCITY
          - KILDARE
          - KILKENNY
          - KERRY
          - LAOIS
          - LIMERICK
          - LEITRIM
          - LONGFORD
          - LOUTH
          - MAYO
          - MEATH
          - MONAGHAN
          - WATERFORD
          - OFFALY
          - ROSCOMMON
          - SLIGO
          - TIPPERARY
          - WESTMEATH
          - WICKLOW
          - CORKCOCO
          - CORKCITY
          - WEXFORD
          - DLR
          - FINGAL
          - SOUTHDUBLIN
          - DUBLINCITY
          - DUBLINCC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Scrape one authority backwards from newest unchecked blank
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          PROFESSIONAL_AUTHORITY: ${{ matrix.authority }}
          PROFESSIONAL_WORKER_LIMIT: "300"
          PROFESSIONAL_WORKER_DELAY_MS: "500"
        run: npm run work:planning-professionals
