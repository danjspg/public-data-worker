name: Process active Planning exact source checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/active-planning-exact.yml"
      - "src/active-planning-exact.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-active-planning-exact
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check worker database
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
        run: npm run health
      - name: Process active Planning source checks
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          ACTIVE_PLANNING_WORKER_LIMIT: "500"
          ACTIVE_PLANNING_SOURCE_BATCH: "150"
        run: npm run work:active-planning
